name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders so the production build doesn't choke on missing env.
      # Real values are injected by Lovable at deploy time, not here.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_PROJECT_ID: placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # bun.lock is generated inside Lovable's sandbox and pins packages to
      # Lovable's private npm mirror, which returns 403 outside Lovable.
      # Drop it here so bun resolves from the public registry. The lockfile
      # in the repo is untouched (this only affects the CI checkout).
      - name: Install (public registry)
        run: |
          rm -f bun.lock
          bun install
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
